name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select release mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Create or update version pull request
        if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-base-branch: main
          pr-title: "chore: パッケージバージョンを更新"
          commit-message: "chore: パッケージバージョンを更新"
          script: pnpm changeset:version

  build:
    name: Build release artifact
    needs: version
    if: needs.version.outputs.mode == 'publish'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      upload_library_artifact: true

  release:
    name: Publish package and GitHub Release
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    if: needs.version.outputs.mode == 'publish'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download library build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: library-dist
          path: dist/library
      - name: Publish package and GitHub Release
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          create-github-releases: false
          script: pnpm changeset publish
      - name: Create draft release, attach archive, and publish
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ fromJSON(steps.publish.outputs.published-packages)[0].version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          archive_file="${RUNNER_TEMP}/pamphlet-viewer-${RELEASE_VERSION}.tgz"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${tag}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > "${notes_file}"

          pnpm exec node scripts/create-release-archive.ts "${archive_file}"

          release_args=(
            --draft
            --verify-tag
            --title "${tag}"
            --notes-file "${notes_file}"
            --target "${GITHUB_SHA}"
          )
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${tag}" "${release_args[@]}"
          gh release upload "${tag}" "${archive_file}"
          gh release edit "${tag}" --draft=false
