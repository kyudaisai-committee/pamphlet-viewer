name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      upload_library_artifact:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for browser tests
        run: pnpm exec playwright install chrome --with-deps

      - name: Run check
        run: pnpm run check

      - name: Run eslint
        run: pnpm exec eslint .

      - name: Run oxfmt
        run: pnpm exec oxfmt --check

      - name: Run cspell
        run: pnpm exec cspell .

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build

      - name: Upload library build
        if: inputs.upload_library_artifact == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: library-dist
          path: dist/library
          if-no-files-found: error
          retention-days: 1
