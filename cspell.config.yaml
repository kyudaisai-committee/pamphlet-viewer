$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
language: en
dictionaryDefinitions:
  - name: project-words
    path: ./cspell.txt
    addWords: true
dictionaries:
  - project-words
ignorePaths:
  - node_modules/**
  - dist/**
  - pnpm-lock.yaml
  - src/assets/**
  - src/paraglide/**
  - project.inlang/cache/**
  - project.inlang/README.md
